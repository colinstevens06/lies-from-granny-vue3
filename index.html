<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Lies From Granny</title>

		<!--
			Preload the home hero (LCP image) on home routes only — this SPA serves index.html
			for every route, so static preload links would waste bandwidth on non-home landings.
			URLs must match the rendered Netlify CDN srcset in src/router/views/home.vue exactly.
		-->
		<script>
			(function () {
				if (!/^\/(home)?\/?$/.test(window.location.pathname)) return;
				var heroPreloads = [
					{
						href: '/.netlify/images?url=/images/home/lies-from-granny-mobile.jpg&w=500&fm=webp',
						srcset:
							'/.netlify/images?url=/images/home/lies-from-granny-mobile.jpg&w=500&fm=webp 500w, /.netlify/images?url=/images/home/lies-from-granny-mobile.jpg&w=1000&fm=webp 1000w',
						media: '(max-width: 767px)'
					},
					{
						href: '/.netlify/images?url=/images/home/lies-from-granny.jpg&w=1200&fm=webp',
						srcset:
							'/.netlify/images?url=/images/home/lies-from-granny.jpg&w=1200&fm=webp 1200w, /.netlify/images?url=/images/home/lies-from-granny.jpg&w=1800&fm=webp 1800w',
						media: '(min-width: 768px)'
					}
				];
				heroPreloads.forEach(function (preload) {
					var link = document.createElement('link');
					link.rel = 'preload';
					link.as = 'image';
					link.href = preload.href;
					link.setAttribute('imagesrcset', preload.srcset);
					link.setAttribute('imagesizes', '100vw');
					link.setAttribute('media', preload.media);
					link.setAttribute('fetchpriority', 'high');
					document.head.appendChild(link);
				});
			})();
		</script>

		<!-- Favicon -->
		<link rel="shortcut icon" type="image/png" href="/images/home/favicon.png" />

		<!-- Global site tag (gtag.js) - Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-138522178-3"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'UA-138522178-3');
		</script>

		<!-- Font -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
	</head>
	<body>
		<div id="app"></div>
		<form name="contact" netlify netlify-honeypot="bot-field" hidden>
			<input name="name" type="text" />
			<input name="email" type="email" />
			<textarea name="note"></textarea>
		</form>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
